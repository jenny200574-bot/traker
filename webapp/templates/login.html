<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf }}">
  <title>Entrar · Dropi Tracker</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="main" style="max-width: 520px; margin: 4vh auto;">
  <h1>Entrar</h1>
  <p class="lede">Esta copia solo abre con la cuenta creada en este equipo.</p>
  {% if error %}<div class="warn">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack" style="flex-direction: column; align-items: stretch;">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuario<input name="username" required value="{{ username or '' }}" autocomplete="username"></label>
    <label>Clave<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
